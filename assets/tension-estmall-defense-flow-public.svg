<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TENsion EstMall security validation flow</title>
  <desc id="desc">Sanitized public architecture showing approved test traffic through nftables, Snort 2 with NFQUEUE, proxy and WAF, and the EstMall service, followed by evidence review in Wazuh, GoAccess, and team ML analysis.</desc>
  <rect width="1200" height="720" fill="#0b1324"/>
  <rect x="35" y="30" width="1130" height="660" rx="28" fill="#101d33" stroke="#334b6f" stroke-width="2"/>
  <text x="70" y="88" fill="#ffffff" font-size="30" font-weight="700" font-family="Arial, sans-serif">TENsion - EstMall Defense Validation</text>
  <text x="70" y="122" fill="#a9bdd8" font-size="15" font-family="Arial, sans-serif">Sanitized public architecture - no addresses, accounts, or payloads</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(65 225)">
      <rect width="170" height="112" rx="16" fill="#1f4e67" stroke="#38bdf8" stroke-width="2"/>
      <text x="85" y="46" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Authorized Test</text>
      <text x="85" y="76" text-anchor="middle" fill="#c5e8f5" font-size="14">Approved lab traffic</text>
    </g>
    <g transform="translate(275 225)">
      <rect width="170" height="112" rx="16" fill="#263d5e" stroke="#60a5fa" stroke-width="2"/>
      <text x="85" y="46" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">nftables</text>
      <text x="85" y="76" text-anchor="middle" fill="#c7dcf7" font-size="14">Access control</text>
      <text x="85" y="96" text-anchor="middle" fill="#c7dcf7" font-size="13">NFQUEUE</text>
    </g>
    <g transform="translate(485 225)">
      <rect width="170" height="112" rx="16" fill="#4a3a21" stroke="#fbbf24" stroke-width="2"/>
      <text x="85" y="46" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Snort 2</text>
      <text x="85" y="76" text-anchor="middle" fill="#f8e4ae" font-size="14">IDS/IPS rules</text>
    </g>
    <g transform="translate(695 225)">
      <rect width="170" height="112" rx="16" fill="#304b43" stroke="#34d399" stroke-width="2"/>
      <text x="85" y="46" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Proxy + WAF</text>
      <text x="85" y="76" text-anchor="middle" fill="#c7f1e3" font-size="14">L7 filtering</text>
      <text x="85" y="96" text-anchor="middle" fill="#c7f1e3" font-size="13">Web routing</text>
    </g>
    <g transform="translate(905 225)">
      <rect width="170" height="112" rx="16" fill="#4a2859" stroke="#c084fc" stroke-width="2"/>
      <text x="85" y="46" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">EstMall</text>
      <text x="85" y="76" text-anchor="middle" fill="#ead5f6" font-size="14">Training web service</text>
    </g>

    <g fill="none" stroke="#8ba6c9" stroke-width="4" marker-end="url(#arrow)">
      <path d="M235 281H269"/>
      <path d="M445 281H479"/>
      <path d="M655 281H689"/>
      <path d="M865 281H899"/>
    </g>

    <g transform="translate(285 475)">
      <rect width="630" height="135" rx="18" fill="#172940" stroke="#4d6d96" stroke-width="2"/>
      <text x="315" y="38" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Evidence Review</text>
      <text x="105" y="84" text-anchor="middle" fill="#b9d4f2" font-size="16">Wazuh alerts</text>
      <text x="315" y="84" text-anchor="middle" fill="#b9d4f2" font-size="16">GoAccess requests</text>
      <text x="525" y="84" text-anchor="middle" fill="#b9d4f2" font-size="16">Team ML analysis</text>
      <text x="315" y="113" text-anchor="middle" fill="#8fa8c7" font-size="13">Re-test the same cases after each control change</text>
    </g>

    <g fill="none" stroke="#5e7fa7" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowMuted)">
      <path d="M360 342V465"/>
      <path d="M570 342V465"/>
      <path d="M780 342V465"/>
      <path d="M990 342V420H810V465"/>
    </g>
  </g>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#8ba6c9"/>
    </marker>
    <marker id="arrowMuted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#5e7fa7"/>
    </marker>
  </defs>
</svg>
