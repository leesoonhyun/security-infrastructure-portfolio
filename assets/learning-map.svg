      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <text x="60" y="58" fill="#f8fafc" font-size="28" font-weight="700" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">736시간 학습 흐름</text>
  <text x="60" y="88" fill="#9fb3c8" font-size="15" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">구축한 인프라를 공격자 관점으로 검증하고 다시 방어 통제로 연결</text>
