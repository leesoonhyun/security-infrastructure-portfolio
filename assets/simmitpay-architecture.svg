<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SimmitPay 중앙 로그 수집 구성도</title>
  <desc id="desc">지사와 DMZ 및 서버 구간의 로그가 중앙 로그 서버, MariaDB, LogAnalyzer로 전달되는 비식별화 구성</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1200" height="560" rx="26" fill="url(#bg)"/>
  <text x="55" y="55" fill="#fff" font-size="28" font-weight="700" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">SimmitPay · 중앙 로그 파이프라인</text>
  <text x="55" y="85" fill="#9fb3c8" font-size="14" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">실제 주소·계정·도메인을 제거한 공개용 논리 구성</text>
  <g font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif">
    <g transform="translate(55 145)"><rect width="220" height="115" rx="16" fill="#153f5a" stroke="#38bdf8"/><text x="110" y="46" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Branch / Client</text><text x="110" y="75" text-anchor="middle" fill="#b9dff0" font-size="14">업무 단말·지사 장비</text></g>
    <g transform="translate(55 315)"><rect width="220" height="115" rx="16" fill="#153f5a" stroke="#38bdf8"/><text x="110" y="46" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">DMZ / Services</text><text x="110" y="75" text-anchor="middle" fill="#b9dff0" font-size="14">DNS·Web·DB</text></g>
    <g transform="translate(385 230)"><rect width="230" height="125" rx="16" fill="#164e4a" stroke="#2dd4bf"/><text x="115" y="48" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">rsyslog Collector</text><text x="115" y="79" text-anchor="middle" fill="#b9e8df" font-size="14">수신·분류·전달</text></g>
    <g transform="translate(715 230)"><rect width="200" height="125" rx="16" fill="#312e55" stroke="#a78bfa"/><text x="100" y="48" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">MariaDB</text><text x="100" y="79" text-anchor="middle" fill="#d8cef8" font-size="14">중앙 로그 적재</text></g>
    <g transform="translate(995 230)"><rect width="155" height="125" rx="16" fill="#4a3a21" stroke="#fbbf24"/><text x="77" y="46" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">LogAnalyzer</text><text x="77" y="78" text-anchor="middle" fill="#f5dfa7" font-size="14">검색·확인</text></g>
    <path d="M275 202 C330 202 330 275 385 275" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M275 372 C330 372 330 315 385 315" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M615 292 H715" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M915 292 H995" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="500" y="420" text-anchor="middle" fill="#9fb3c8" font-size="14">생성 → 전송 → 수신 → 저장 → 조회 단계별 검증</text>
  </g>
</svg>

